name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Pin third-party actions to immutable commit SHAs for supply-chain safety.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  release:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect bump type
        id: detect
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Avoid an infinite loop: if this commit is already a release bump, do nothing.
          if printf '%s' "$COMMIT_MSG" | grep -qE '^chore\(release\): bump version to '; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release commit; skipping version bump."
            exit 0
          fi

          if printf '%s' "$COMMIT_MSG" | grep -qiE '^(feat!|chore!)'; then
            bump=major
          elif printf '%s' "$COMMIT_MSG" | grep -qiE '^(feat|chore)(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s' "$COMMIT_MSG" | grep -qiE '^(fix)(\([^)]*\))?:'; then
            bump=patch
          else
            echo "No conventional commit prefix (fix / feat / chore / feat! / chore!) found in merge message."
            exit 1
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Bump version, commit, push and tag
        if: steps.detect.outputs.skip != 'true'
        env:
          BUMP: ${{ steps.detect.outputs.bump }}
        run: |
          set -euo pipefail

          current=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/')
          IFS=. read -r major minor patch <<< "$current"

          case "$BUMP" in
            major)
              ((major++)); minor=0; patch=0
              ;;
            minor)
              ((minor++)); patch=0
              ;;
            patch)
              ((patch++))
              ;;
          esac

          new_version="${major}.${minor}.${patch}"

          sed -i "s/^version = \"[0-9]*\\.[0-9]*\\.[0-9]*\"/version = \"${new_version}\"/" Cargo.toml
          cargo update -p pmp

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to ${new_version}"
          git push origin HEAD:main

          git tag -a "v${new_version}" -m "Release v${new_version}"
          git push origin "v${new_version}"
