[package]
name = "pmp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Diego Torréns Farias <dtorrensfarias@outlook.com>"]

[dependencies]
anyhow = "1"
crossterm = "0.29"
dirs = "5"
ratatui = "0.30.2"
refinery = { version = "0.8", features = ["rusqlite"] }
rmcp = { version = "2.1.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
thiserror = "1"
ratatui-textarea = "0.9"
tokio = { version = "1.52.3", features = ["rt", "macros", "io-util"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tempfile = "3"
