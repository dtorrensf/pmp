[package]
name = "pmp"
version = "0.6.1"
repository = "https://github.com/dtorrensf/pmp"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Diego Torréns Farias <dtorrensfarias@outlook.com>"]

[dependencies]
anyhow = "1"
crossterm = "0.29"
dirs = "5"
ratatui = "0.30.2"
refinery = { version = "0.8", features = ["rusqlite"] }
rmcp = { version = "2.1.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
signal-hook = "0.3"
thiserror = "1"
ratatui-textarea = "0.9"
tracing = "0.1"
unicode-width = "0.2"
tokio = { version = "1.52.3", features = ["rt", "macros", "io-util", "time", "process", "sync"] }
ureq = { version = "3", features = ["rustls"] }
semver = "1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
mockito = "1.7.2"
pretty_assertions = "1"
tempfile = "3"
